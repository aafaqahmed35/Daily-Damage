[package]
name = "daily-damage"
version = "0.1.0"
description = "Daily Damage personal desktop companion"
authors = ["Aafaq Ahmed"]
edition = "2021"

[lib]
name = "daily_damage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
